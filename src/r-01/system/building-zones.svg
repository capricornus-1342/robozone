<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 0 1590 650" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="mk-truck" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="mk-pallet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B4513"/>
    </marker>
    <marker id="mk-box" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0050C8"/>
    </marker>
    <marker id="mk-item" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C00000"/>
    </marker>
    <marker id="mk-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E67E00"/>
    </marker>
    <marker id="mk-roll" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#008000"/>
    </marker>
    <marker id="mk-waste" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#808080"/>
    </marker>
    <marker id="mk-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6A0DAD"/>
    </marker>
    <marker id="mk-conv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>

  <rect x="-140" y="0" width="1590" height="650" fill="#FFFFFF"/>

  <text x="150" y="28" font-size="20" font-weight="bold" fill="#000000">Схема здания сортировочного центра — вид сверху</text>
  <text x="150" y="48" font-size="12" fill="#333333">Зоны и потоки по спецификации v2.0 · масштаб 1 м = 3 px · здание 300 × 185 м ≈ 55 500 м² · площадь зон ≈ 39 700 м²</text>

  <!-- WMS — информационные потоки (над зданием) -->
  <path d="M 50 54 L 930 54" stroke="#6A0DAD" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#mk-info)"/>
  <text x="900" y="28" font-size="8" fill="#6A0DAD" text-anchor="end">WMS — информационные потоки (привязка на каждом шаге)</text>

  <!-- ==================== ЗДАНИЕ ==================== -->
  <rect x="40" y="60" width="900" height="555" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <rect x="40" y="60" width="10" height="555" fill="#E8E8E8" stroke="none"/>
  <rect x="930" y="60" width="10" height="555" fill="#E8E8E8" stroke="none"/>
  <text x="18" y="56" font-size="9" fill="#666666" text-anchor="end">ворота приёмки 6–8 (запад)</text>
  <text x="960" y="56" font-size="9" fill="#666666" text-anchor="start">ворота отгрузки 24 (восток)</text>

  <!-- Ворота приёмки (8 шт по ~9 м) на западной стене -->
  <g fill="#A0A0A0">
    <rect x="38" y="66"  width="4" height="27"/>
    <rect x="38" y="95"  width="4" height="27"/>
    <rect x="38" y="124" width="4" height="27"/>
    <rect x="38" y="153" width="4" height="27"/>
    <rect x="38" y="182" width="4" height="27"/>
    <rect x="38" y="211" width="4" height="27"/>
    <rect x="38" y="240" width="4" height="27"/>
    <rect x="38" y="269" width="4" height="27"/>
  </g>
  <!-- Ворота отгрузки (24 шт по ~6,7 м) на восточной стене -->
  <g fill="#A0A0A0">
    <rect x="938" y="66"  width="4" height="20"/>
    <rect x="938" y="89"  width="4" height="20"/>
    <rect x="938" y="112" width="4" height="20"/>
    <rect x="938" y="135" width="4" height="20"/>
    <rect x="938" y="158" width="4" height="20"/>
    <rect x="938" y="181" width="4" height="20"/>
    <rect x="938" y="204" width="4" height="20"/>
    <rect x="938" y="227" width="4" height="20"/>
    <rect x="938" y="250" width="4" height="20"/>
    <rect x="938" y="273" width="4" height="20"/>
    <rect x="938" y="296" width="4" height="20"/>
    <rect x="938" y="319" width="4" height="20"/>
    <rect x="938" y="342" width="4" height="20"/>
    <rect x="938" y="365" width="4" height="20"/>
    <rect x="938" y="388" width="4" height="20"/>
    <rect x="938" y="411" width="4" height="20"/>
    <rect x="938" y="434" width="4" height="20"/>
    <rect x="938" y="457" width="4" height="20"/>
    <rect x="938" y="480" width="4" height="20"/>
    <rect x="938" y="503" width="4" height="20"/>
    <rect x="938" y="526" width="4" height="20"/>
    <rect x="938" y="549" width="4" height="20"/>
    <rect x="938" y="572" width="4" height="20"/>
    <rect x="938" y="595" width="4" height="20"/>
  </g>
  <!-- Ворота вывоза отходов (южная стена) -->
  <g fill="#A0A0A0">
    <rect x="718" y="610" width="16" height="5"/>
  </g>

  <!-- ==================== ЗОНЫ ==================== -->
  <!-- Единый зазор между всеми зонами = 8 px (≈2,7 м); зона сортировки — самая большая, от верха до низа; инфиды — 10 станций, каждая слева от своей конвейерной линии; заклейка → сортировка ящиков → паллетирование → отгрузка — выровненные по вертикали полосы слева направо (площади по спецификации) -->
  <g stroke="#00008B" stroke-width="1.5">
    <rect x="392" y="68"   width="280" height="495" fill="#EAF4EA"/>   <!-- Сортировка (центральная, от верха до низа) -->
    <rect x="348" y="105"  width="36"  height="38"  fill="#EAF4EA"/>   <!-- Инфид И1 -->
    <rect x="348" y="151"  width="36"  height="38"  fill="#EAF4EA"/>   <!-- Инфид И2 -->
    <rect x="348" y="197"  width="36"  height="38"  fill="#EAF4EA"/>   <!-- Инфид И3 -->
    <rect x="348" y="243"  width="36"  height="38"  fill="#EAF4EA"/>   <!-- Инфид И4 -->
    <rect x="348" y="289"  width="36"  height="38"  fill="#EAF4EA"/>   <!-- Инфид И5 -->
    <rect x="348" y="335"  width="36"  height="38"  fill="#EAF4EA"/>   <!-- Инфид И6 -->
    <rect x="348" y="381"  width="36"  height="38"  fill="#EAF4EA"/>   <!-- Инфид И7 -->
    <rect x="348" y="427"  width="36"  height="38"  fill="#EAF4EA"/>   <!-- Инфид И8 -->
    <rect x="348" y="473"  width="36"  height="38"  fill="#EAF4EA"/>   <!-- Инфид И9 -->
    <rect x="348" y="519"  width="36"  height="38"  fill="#EAF4EA"/>   <!-- Инфид И10 -->
    <rect x="48"  y="68"   width="120" height="240" fill="#DCEBF5"/>   <!-- Приёмка -->
    <rect x="48"  y="316"  width="120" height="40"  fill="#EDEDED"/>   <!-- Накопитель паллет -->
    <rect x="176" y="68"   width="110" height="90"  fill="#EAF4EA"/>   <!-- Разукрупнение -->
    <rect x="176" y="166"  width="110" height="178" fill="#E0E0E0"/>   <!-- Инфраструктура (управляющая) -->
    <rect x="294" y="68"   width="46"  height="130" fill="#EAF4EA"/>   <!-- Вскрытие -->
    <rect x="294" y="206"  width="46"  height="218" fill="#EAF4EA"/>   <!-- Сток пустых ящиков -->
    <rect x="176" y="352"  width="110" height="211" fill="#FFF3D6"/>   <!-- Nonsort -->
    <rect x="680" y="68"   width="33"  height="495" fill="#EAF4EA"/>   <!-- Заклейка (полоса, слева) -->
    <rect x="721" y="68"   width="76"  height="495" fill="#EAF4EA"/>   <!-- Сортировка ящиков (полоса) -->
    <rect x="805" y="68"   width="16"  height="495" fill="#EAF4EA"/>   <!-- Паллетирование (полоса) -->
    <rect x="829" y="68"   width="69"  height="495" fill="#DCEBF5"/>   <!-- Отгрузка (полоса, справа) -->
    <rect x="550" y="571"  width="122" height="36"  fill="#FFF3D6"/>   <!-- Возвратные (под сортировкой) -->
    <rect x="680" y="571"  width="92"  height="36"  fill="#F5E0E0"/>   <!-- Брак -->
  </g>

  <!-- ==================== 10 СОРТИРОВОЧНЫХ КОНВЕЙЕРОВ (горизонтальные ленты слева направо, одна под другой) ==================== -->
  <g stroke="#444444" stroke-width="2.5" fill="none">
    <path d="M 400 124 L 664 124" marker-end="url(#mk-conv)"/>
    <path d="M 400 170 L 664 170" marker-end="url(#mk-conv)"/>
    <path d="M 400 216 L 664 216" marker-end="url(#mk-conv)"/>
    <path d="M 400 262 L 664 262" marker-end="url(#mk-conv)"/>
    <path d="M 400 308 L 664 308" marker-end="url(#mk-conv)"/>
    <path d="M 400 354 L 664 354" marker-end="url(#mk-conv)"/>
    <path d="M 400 400 L 664 400" marker-end="url(#mk-conv)"/>
    <path d="M 400 446 L 664 446" marker-end="url(#mk-conv)"/>
    <path d="M 400 492 L 664 492" marker-end="url(#mk-conv)"/>
    <path d="M 400 538 L 664 538" marker-end="url(#mk-conv)"/>
  </g>
  <g font-size="8" fill="#444444">
    <text x="402" y="120" font-size="8">1</text>
    <text x="402" y="166" font-size="8">2</text>
    <text x="402" y="212" font-size="8">3</text>
    <text x="402" y="258" font-size="8">4</text>
    <text x="402" y="304" font-size="8">5</text>
    <text x="402" y="350" font-size="8">6</text>
    <text x="402" y="396" font-size="8">7</text>
    <text x="402" y="442" font-size="8">8</text>
    <text x="402" y="488" font-size="8">9</text>
    <text x="402" y="534" font-size="8">10</text>
  </g>

  <!-- ==================== НАЗВАНИЯ ЗОН ==================== -->
  <g font-size="11" font-weight="bold" fill="#000080" text-anchor="middle">
    <text x="110" y="130" font-size="11">ПРИЁМКА</text>
    <text x="110" y="146" font-size="8" font-weight="normal" fill="#333333">ворота 6–8 · буфер ≈400</text>
    <text x="110" y="162" font-size="9" font-weight="normal" fill="#333333">≈3 200 м²</text>
    <text x="110" y="326" font-size="9">НАКОПИТЕЛЬ</text>
    <text x="110" y="340" font-size="8" font-weight="normal" fill="#333333">пустых паллет</text>
    <text x="110" y="352" font-size="8" font-weight="normal" fill="#333333">≈533 м²</text>
    <text x="229" y="90" font-size="11">РАЗУКРУПНЕНИЕ</text>
    <text x="229" y="104" font-size="8" font-weight="normal" fill="#333333">депаллетайзеры 3–4</text>
    <text x="229" y="118" font-size="9" font-weight="normal" fill="#333333">≈1 100 м²</text>
    <text x="229" y="178" font-size="11">ИНФРАСТРУКТУРА</text>
    <text x="229" y="192" font-size="8" font-weight="normal" fill="#333333">серверная · зарядные AGV</text>
    <text x="229" y="206" font-size="9" font-weight="normal" fill="#333333">≈2 176 м²</text>
    <text x="311" y="94" font-size="11" transform="rotate(-90 311 94)">ВСКРЫТИЕ</text>
    <text x="311" y="122" font-size="11" transform="rotate(-90 311 122)">ЯЩИКОВ</text>
    <text x="311" y="158" font-size="8" font-weight="normal" fill="#333333" transform="rotate(-90 311 158)">≈664 м²</text>
    <text x="315" y="220" font-size="8" font-weight="normal" fill="#333333">СТОК</text>
    <text x="315" y="234" font-size="8" font-weight="normal" fill="#333333">ПУСТЫХ</text>
    <text x="315" y="248" font-size="8" font-weight="normal" fill="#333333">ЯЩИКОВ</text>
    <text x="315" y="262" font-size="8" font-weight="normal" fill="#333333">≈1 114 м²</text>
    <text x="229" y="364" font-size="10">ЗОНА NONSORT</text>
    <text x="229" y="378" font-size="8" font-weight="normal" fill="#333333">адресные ячейки</text>
    <text x="229" y="390" font-size="8" font-weight="normal" fill="#333333">(роллтейнеры)</text>
    <text x="229" y="404" font-size="9" font-weight="normal" fill="#333333">≈2 579 м²</text>
    <text x="740" y="582" font-size="10">БРАК</text>
    <text x="740" y="600" font-size="8" font-weight="normal" fill="#333333">≈368 м²</text>
    <text x="611" y="584" font-size="9">ВОЗВРАТНЫЕ</text>
    <text x="611" y="596" font-size="8" font-weight="normal" fill="#333333">≈488 м²</text>
    <text x="550" y="81" font-size="11">ЗОНА СОРТИРОВКИ</text>
    <text x="550" y="92" font-size="9" font-weight="normal" fill="#333333">10 конвейеров · по 10 000 товаров/ч</text>
    <text x="550" y="106" font-size="9" font-weight="normal" fill="#333333">≈15 400 м²</text>
    <text x="697" y="250" font-size="11" transform="rotate(-90 697 250)">ЗАКЛЕЙКА</text>
    <text x="697" y="330" font-size="8" font-weight="normal" fill="#333333" transform="rotate(-90 697 330)">линия ≥3 700 ящиков/ч</text>
    <text x="697" y="405" font-size="9" font-weight="normal" fill="#333333" transform="rotate(-90 697 405)">≈1 815 м²</text>
    <text x="759" y="180" font-size="10" transform="rotate(-90 759 180)">СОРТИРОВКА ЯЩИКОВ ПО НАПРАВЛЕНИЯМ (400)</text>
    <text x="759" y="380" font-size="8" font-weight="normal" fill="#333333" transform="rotate(-90 759 380)">+ буфер отгрузки ≈370 паллет</text>
    <text x="759" y="480" font-size="9" font-weight="normal" fill="#333333" transform="rotate(-90 759 480)">≈4 180 м²</text>
    <text x="813" y="150" font-size="9" transform="rotate(-90 813 150)">ПАЛЛЕТИРОВАНИЕ</text>
    <text x="813" y="240" font-size="8" font-weight="normal" fill="#333333" transform="rotate(-90 813 240)">185 паллет/ч</text>
    <text x="813" y="310" font-size="8" font-weight="normal" fill="#333333" transform="rotate(-90 813 310)">≈880 м²</text>
    <text x="863" y="180" font-size="10" transform="rotate(-90 863 180)">ОТГРУЗКА (24 ВОРОТА)</text>
    <text x="863" y="300" font-size="8" font-weight="normal" fill="#333333" transform="rotate(-90 863 300)">≈11,6 маш/ч · 2 ч погрузка</text>
    <text x="863" y="400" font-size="9" font-weight="normal" fill="#333333" transform="rotate(-90 863 400)">≈3 685 м²</text>
  </g>

  <!-- ==================== СТРЕЛКИ ПОТОКОВ ==================== -->

  <!-- МАШИНЫ (грузовики) — чёрный -->
  <g stroke="#333333" stroke-width="2.2" fill="none">
    <path d="M 20 195 L 38 195" marker-end="url(#mk-truck)"/>
    <path d="M 942 470 L 956 470" marker-end="url(#mk-truck)"/>
  </g>
  <text x="36" y="170" font-size="9" fill="#333333" text-anchor="end">Входящие машины ≈5,8/ч</text>
  <text x="36" y="184" font-size="9" fill="#333333" text-anchor="end">(32 паллеты)</text>
  <text x="960" y="460" font-size="9" fill="#333333">Исходящие машины ≈11,6/ч</text>
  <text x="960" y="488" font-size="9" fill="#333333">(32 паллеты = 16 ящиков + 16 роллтейнеров, 2 ч)</text>

  <!-- ПАЛЛЕТЫ — коричневый -->
  <g stroke="#8B4513" stroke-width="2.2" fill="none">
    <path d="M 168 356 L 172 356 L 172 612 L 924 612 L 813 612 L 813 563" marker-end="url(#mk-pallet)"/>
    <path d="M 100 308 L 100 316" marker-end="url(#mk-pallet)"/>
    <path d="M 821 250 L 829 250" marker-end="url(#mk-pallet)"/>
    <path d="M 898 470 L 938 470" marker-end="url(#mk-pallet)"/>
  </g>
  <text x="56" y="214" font-size="8" fill="#8B4513">Паллеты входные (185/ч)</text>
  <text x="56" y="240" font-size="8" fill="#8B4513">Паллеты порожние (185/ч)</text>
  <text x="52" y="470" font-size="8" fill="#8B4513">Паллеты → паллетирование</text>
  <text x="820" y="600" font-size="8" fill="#8B4513">Паллеты исходящие (185/ч)</text>

  <!-- ЯЩИКИ — синий -->
  <g stroke="#0050C8" stroke-width="2.2" fill="none">
    <path d="M 286 120 L 294 120" marker-end="url(#mk-box)"/>
    <path d="M 311 198 L 311 206" marker-end="url(#mk-box)"/>
    <path d="M 340 260 L 348 260" marker-end="url(#mk-box)"/>
    <path d="M 672 100 L 680 100" marker-end="url(#mk-box)"/>
    <path d="M 713 250 L 721 250" marker-end="url(#mk-box)"/>
    <path d="M 797 450 L 805 450" marker-end="url(#mk-box)"/>
  </g>
  <text x="240" y="130" font-size="8" fill="#0050C8">Ящики</text>
  <text x="240" y="142" font-size="8" fill="#0050C8">(3 700/ч)</text>
  <text x="296" y="380" font-size="8" fill="#0050C8">Ящики</text>
  <text x="296" y="394" font-size="8" fill="#0050C8">пустые</text>
  <text x="296" y="408" font-size="8" fill="#0050C8">3 700/ч</text>
  <text x="670" y="98" font-size="8" fill="#0050C8" text-anchor="end">Ящики заполненные (3 700/ч)</text>
  <text x="733" y="520" font-size="7" fill="#0050C8">Ящики на паллеты</text>
  <text x="733" y="532" font-size="7" fill="#0050C8">(185 паллет/ч)</text>

  <!-- ТОВАРЫ — красный -->
  <g stroke="#C00000" stroke-width="2.2" fill="none">
    <path d="M 384 260 L 392 260" marker-end="url(#mk-item)"/>
    <path d="M 392 470 L 390 470 L 390 559 L 290 559 L 290 470 L 286 470" marker-end="url(#mk-item)"/>
  </g>
  <text x="416" y="248" font-size="8" fill="#C00000">Товары (100 000/ч)</text>
  <text x="410" y="506" font-size="8" fill="#C00000">Товары nonsort</text>
  <text x="410" y="518" font-size="8" fill="#C00000">(5–15 %)</text>

  <!-- ИСКЛЮЧЕНИЯ / ВОЗВРАТ — оранжевый -->
  <g stroke="#E67E00" stroke-width="2.2" fill="none">
    <path d="M 604 563 L 604 571" marker-end="url(#mk-return)"/>
    <path d="M 611 571 L 611 563" marker-end="url(#mk-return)"/>
  </g>
  <text x="450" y="580" font-size="7" fill="#E67E00">Исключения (1–3 %)</text>
  <text x="450" y="592" font-size="7" fill="#E67E00">повторный прогон</text>

  <!-- РОЛЛТЕЙНЕРЫ — зелёный -->
  <g stroke="#008000" stroke-width="2.2" fill="none">
    <path d="M 284 563 L 284 565 L 829 565" marker-end="url(#mk-roll)"/>
    <path d="M 829 565 L 284 565 L 284 563 L 282 563" marker-end="url(#mk-roll)"/>
  </g>
  <text x="300" y="580" font-size="8" fill="#008000">Роллтейнеры → отгрузка</text>
  <text x="300" y="592" font-size="8" fill="#008000">(185/ч)</text>
  <text x="302" y="602" font-size="8" fill="#008000">Роллтейнеры порожние → nonsort</text>

  <!-- БРАК / ОТХОДЫ — серый -->
  <g stroke="#808080" stroke-width="2.2" fill="none">
    <path d="M 676 563 L 676 571" marker-end="url(#mk-waste)"/>
    <path d="M 726 607 L 726 615" marker-end="url(#mk-waste)"/>
  </g>
  <text x="402" y="290" font-size="8" fill="#808080">Брак ящиков</text>
  <text x="402" y="304" font-size="8" fill="#808080">(740/ч)</text>
  <text x="660" y="602" font-size="8" fill="#808080" text-anchor="end">Вывоз брака и отходов</text>

  <!-- ==================== ЛЕГЕНДА ==================== -->
  <g font-size="11">
    <text x="1260" y="78" font-weight="bold" fill="#000000">Условные обозначения</text>
    <line x1="1260" y1="96" x2="1300" y2="96" stroke="#333333" stroke-width="2.5"/>
    <text x="1308" y="100" font-size="10">Машины (грузовики)</text>
    <line x1="1260" y1="116" x2="1300" y2="116" stroke="#8B4513" stroke-width="2.5"/>
    <text x="1308" y="120" font-size="10">Паллеты</text>
    <line x1="1260" y1="136" x2="1300" y2="136" stroke="#0050C8" stroke-width="2.5"/>
    <text x="1308" y="140" font-size="10">Ящики (КТЯ)</text>
    <line x1="1260" y1="156" x2="1300" y2="156" stroke="#C00000" stroke-width="2.5"/>
