<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 0 1590 650" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="mk-truck" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="mk-pallet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B4513"/>
    </marker>
    <marker id="mk-box" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0050C8"/>
    </marker>
    <marker id="mk-item" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C00000"/>
    </marker>
    <marker id="mk-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E67E00"/>
    </marker>
    <marker id="mk-roll" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#008000"/>
    </marker>
    <marker id="mk-waste" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#808080"/>
    </marker>
    <marker id="mk-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6A0DAD"/>
    </marker>
  </defs>

  <rect x="-140" y="0" width="1590" height="650" fill="#FFFFFF"/>

  <text x="150" y="28" font-size="20" font-weight="bold" fill="#000000">Схема здания сортировочного центра — вид сверху</text>
  <text x="150" y="48" font-size="12" fill="#333333">Зоны и потоки по спецификации v2.0 · масштаб 1 м = 3 px · здание 300 × 185 м ≈ 55 500 м² · площадь зон ≈ 35 600 м²</text>

  <!-- ==================== ЗДАНИЕ ==================== -->
  <rect x="40" y="60" width="900" height="555" fill="#FFFFFF"/>
  <rect x="40" y="60" width="10" height="555" fill="#E8E8E8" stroke="none"/>
  <rect x="930" y="60" width="10" height="555" fill="#E8E8E8" stroke="none"/>
  <text x="18" y="56" font-size="9" fill="#666666" text-anchor="end">ворота приёмки 6–8 (запад)</text>
  <text x="960" y="44" font-size="9" fill="#666666" text-anchor="start">ворота отгрузки 24 (восток)</text>

  <!-- ==================== ЗОНЫ ==================== -->
  <g stroke="#FFFFFF" stroke-width="5">
    <rect x="40"   y="60"   width="110" height="240" fill="#DCEBF5"/>   <!-- Приёмка -->
    <rect x="150"  y="60"   width="190" height="90"  fill="#E0E0E0"/>   <!-- Инфраструктура -->
    <rect x="640"  y="60"   width="210" height="90"  fill="#FFF3D6"/>   <!-- Nonsort -->
    <rect x="150"  y="150"  width="120" height="75"  fill="#EAF4EA"/>   <!-- Разукрупнение -->
    <rect x="270"  y="150"  width="90"  height="75"  fill="#EAF4EA"/>   <!-- Вскрытие -->
    <rect x="360"  y="150"  width="210" height="75"  fill="#EAF4EA"/>   <!-- Инфиды -->
    <rect x="570"  y="150"  width="70"  height="75"  fill="#FFF3D6"/>   <!-- Возвратные -->
    <rect x="270"  y="225"  width="150" height="75"  fill="#EAF4EA"/>   <!-- Сток -->
    <rect x="40"   y="315"  width="60"  height="75"  fill="#EDEDED"/>   <!-- Накопитель -->
    <rect x="170"  y="300"  width="470" height="240" fill="#EAF4EA"/>   <!-- Сортировка -->
    <rect x="640"  y="300"  width="210" height="75"  fill="#EAF4EA"/>   <!-- Заклейка -->
    <rect x="640"  y="375"  width="210" height="135" fill="#EAF4EA"/>   <!-- Сортировка ящиков + буфер -->
    <rect x="660"  y="510"  width="140" height="75"  fill="#EAF4EA"/>   <!-- Паллетирование -->
    <rect x="870"  y="60"   width="70"  height="480" fill="#DCEBF5"/>   <!-- Отгрузка -->
    <rect x="40"   y="540"  width="60"  height="75"  fill="#F5E0E0"/>   <!-- Брак -->
  </g>
  <g stroke="#00008B" stroke-width="1.5" fill="none">
    <rect x="40"   y="60"   width="110" height="240"/>
    <rect x="150"  y="60"   width="190" height="90"/>
    <rect x="640"  y="60"   width="210" height="90"/>
    <rect x="150"  y="150"  width="120" height="75"/>
    <rect x="270"  y="150"  width="90"  height="75"/>
    <rect x="360"  y="150"  width="210" height="75"/>
    <rect x="570"  y="150"  width="70"  height="75"/>
    <rect x="270"  y="225"  width="150" height="75"/>
    <rect x="40"   y="315"  width="60"  height="75"/>
    <rect x="170"  y="300"  width="470" height="240"/>
    <rect x="640"  y="300"  width="210" height="75"/>
    <rect x="640"  y="375"  width="210" height="135"/>
    <rect x="660"  y="510"  width="140" height="75"/>
    <rect x="870"  y="60"   width="70"  height="480"/>
    <rect x="40"   y="540"  width="60"  height="75"/>
  </g>

  <!-- Стены и ворота поверх отступов зон -->
  <rect x="40" y="60" width="900" height="555" fill="none" stroke="#000000" stroke-width="2.5"/>
  <g fill="#A0A0A0">
    <rect x="38" y="66"  width="4" height="27"/>
    <rect x="38" y="95"  width="4" height="27"/>
    <rect x="38" y="124" width="4" height="27"/>
    <rect x="38" y="153" width="4" height="27"/>
    <rect x="38" y="182" width="4" height="27"/>
    <rect x="38" y="211" width="4" height="27"/>
    <rect x="38" y="240" width="4" height="27"/>
    <rect x="38" y="269" width="4" height="27"/>
  </g>
  <g fill="#A0A0A0">
    <rect x="938" y="66"  width="4" height="20"/>
    <rect x="938" y="89"  width="4" height="20"/>
    <rect x="938" y="112" width="4" height="20"/>
    <rect x="938" y="135" width="4" height="20"/>
    <rect x="938" y="158" width="4" height="20"/>
    <rect x="938" y="181" width="4" height="20"/>
    <rect x="938" y="204" width="4" height="20"/>
    <rect x="938" y="227" width="4" height="20"/>
    <rect x="938" y="250" width="4" height="20"/>
    <rect x="938" y="273" width="4" height="20"/>
    <rect x="938" y="296" width="4" height="20"/>
    <rect x="938" y="319" width="4" height="20"/>
    <rect x="938" y="342" width="4" height="20"/>
    <rect x="938" y="365" width="4" height="20"/>
    <rect x="938" y="388" width="4" height="20"/>
    <rect x="938" y="411" width="4" height="20"/>
    <rect x="938" y="434" width="4" height="20"/>
    <rect x="938" y="457" width="4" height="20"/>
    <rect x="938" y="480" width="4" height="20"/>
    <rect x="938" y="503" width="4" height="20"/>
    <rect x="938" y="526" width="4" height="20"/>
    <rect x="938" y="549" width="4" height="20"/>
    <rect x="938" y="572" width="4" height="20"/>
    <rect x="938" y="595" width="4" height="20"/>
  </g>

  <!-- ==================== НАЗВАНИЯ ЗОН ==================== -->
  <g font-size="11" font-weight="bold" fill="#000080" text-anchor="middle">
    <text x="95"  y="88">ПРИЁМКА</text>
    <text x="95"  y="102" font-size="8" font-weight="normal" fill="#333333">ворота 6–8 · буфер ≈400</text>
    <text x="95"  y="116" font-size="9" font-weight="normal" fill="#333333">≈2 950 м²</text>
    <text x="245" y="88">ИНФРАСТРУКТУРА</text>
    <text x="245" y="102" font-size="9" font-weight="normal" fill="#333333">серверная · зарядные AGV</text>
    <text x="245" y="116" font-size="9" font-weight="normal" fill="#333333">≈1 900 м²</text>
    <text x="745" y="88">ЗОНА NONSORT</text>
    <text x="745" y="102" font-size="9" font-weight="normal" fill="#333333">адресные ячейки · роллтейнеры</text>
    <text x="745" y="116" font-size="9" font-weight="normal" fill="#333333">до 192 роллтейнеров/ч · ≈2 100 м²</text>
    <text x="210" y="172">РАЗУКРУПНЕНИЕ</text>
    <text x="215" y="186" font-size="9" font-weight="normal" fill="#333333">депаллетайзеры 3–4</text>
    <text x="210" y="198" font-size="9" font-weight="normal" fill="#333333">≈1 000 м²</text>
    <text x="315" y="168">ВСКРЫТИЕ</text>
    <text x="315" y="181">ЯЩИКОВ</text>
    <text x="315" y="202" font-size="8" font-weight="normal" fill="#333333">срез скотча, выемка</text>
    <text x="315" y="214" font-size="9" font-weight="normal" fill="#333333">≈750 м²</text>
    <text x="465" y="172">ЗОНА ПОДАЧИ (ИНФИДЫ)</text>
    <text x="465" y="186" font-size="9" font-weight="normal" fill="#333333">10 станций · сканеры · вес/габариты</text>
    <text x="465" y="198" font-size="9" font-weight="normal" fill="#333333">≈1 750 м²</text>
    <text x="605" y="166" font-size="10">ВОЗВРАТНЫЕ</text>
    <text x="605" y="178" font-size="9" font-weight="normal" fill="#333333">ПОТОКИ</text>
    <text x="605" y="236" font-size="9" font-weight="normal" fill="#333333">≈600 м²</text>
    <text x="345" y="258">СТОК</text>
    <text x="345" y="272">ПУСТЫХ ЯЩИКОВ</text>
    <text x="345" y="286" font-size="9" font-weight="normal" fill="#333333">+ машина новых ящиков</text>
    <text x="380" y="248" font-size="9" font-weight="normal" fill="#333333">≈1 250 м²</text>
    <text x="70"  y="330" font-size="9">НАКОПИТЕЛЬ</text>
    <text x="70"  y="344" font-size="8" font-weight="normal" fill="#333333">пустых паллет</text>
    <text x="70"  y="358" font-size="8" font-weight="normal" fill="#333333">≈500 м²</text>
    <text x="395" y="392">ЗОНА СОРТИРОВКИ</text>
    <text x="395" y="406" font-size="9" font-weight="normal" fill="#333333">10 сортировщиков (по 10 000 товаров/ч)</text>
    <text x="395" y="420" font-size="9" font-weight="normal" fill="#333333">установка/съём ящиков · утряска</text>
    <text x="395" y="434" font-size="9" font-weight="normal" fill="#333333">≈12 500 м²</text>
    <text x="745" y="330">ЗАКЛЕЙКА</text>
    <text x="745" y="344" font-size="9" font-weight="normal" fill="#333333">линия ≥3 700 ящиков/ч</text>
    <text x="745" y="358" font-size="9" font-weight="normal" fill="#333333">≈1 750 м²</text>
    <text x="745" y="410">СОРТИРОВКА ЯЩИКОВ</text>
    <text x="745" y="424" font-size="9" font-weight="normal" fill="#333333">ПО НАПРАВЛЕНИЯМ (400)</text>
    <text x="745" y="438" font-size="9" font-weight="normal" fill="#333333">+ буфер отгрузки ≈370 паллет</text>
    <text x="745" y="452" font-size="9" font-weight="normal" fill="#333333">≈3 150 м²</text>
    <text x="748" y="536">ПАЛЛЕТИРОВАНИЕ</text>
    <text x="734" y="550" font-size="8" font-weight="normal" fill="#333333">паллетайзеры · 185 паллет/ч</text>
    <text x="730" y="564" font-size="9" font-weight="normal" fill="#333333">≈1 170 м²</text>
    <text x="905" y="130" font-size="11" transform="rotate(-90 905 130)">ОТГРУЗКА (24 ВОРОТА)</text>
    <text x="905" y="320" font-size="9" font-weight="normal" fill="#333333" transform="rotate(-90 905 320)">12 машин/ч · 2 ч погрузка · ≈3 700 м²</text>
    <text x="70"  y="552">БРАК</text>
    <text x="70"  y="564">ЯЩИКОВ</text>
    <text x="70"  y="578" font-size="9" font-weight="normal" fill="#333333">И ОТХОДЫ</text>
    <text x="70"  y="590" font-size="8" font-weight="normal" fill="#333333">компактор</text>
    <text x="70"  y="602" font-size="9" font-weight="normal" fill="#333333">≈500 м²</text>
  </g>

  <!-- ==================== СТРЕЛКИ ПОТОКОВ ==================== -->

  <!-- МАШИНЫ (грузовики) — чёрный -->
  <g stroke="#333333" stroke-width="2.2" fill="none">
    <path d="M 20 195 L 38 195" marker-end="url(#mk-truck)"/>
    <path d="M 942 300 L 956 300" marker-end="url(#mk-truck)"/>
  </g>
  <text x="36" y="170" font-size="9" fill="#333333" text-anchor="end">Входящие машины ≈5,8/ч</text>
  <text x="36" y="184" font-size="9" fill="#333333" text-anchor="end">(32 паллеты)</text>
  <text x="960" y="286" font-size="9" fill="#333333">Исходящие машины ≈11,6/ч</text>
  <text x="960" y="314" font-size="9" fill="#333333">(32 паллеты = 16 ящиков + 16 роллтейнеров, 2 ч)</text>

  <!-- ПАЛЛЕТЫ — коричневый -->
  <g stroke="#8B4513" stroke-width="2.2" fill="none">
    <path d="M 148 180 L 164 180" marker-end="url(#mk-pallet)"/>
    <path d="M 158 225 L 158 355 L 100 355" marker-end="url(#mk-pallet)"/>
    <path d="M 100 370 L 158 370 L 158 540 L 640 540 L 640 520 L 660 520" marker-end="url(#mk-pallet)"/>
    <path d="M 800 545 L 870 545" marker-end="url(#mk-pallet)"/>
  </g>
  <text x="46" y="180" font-size="9" fill="#8B4513">Паллеты входные</text>
  <text x="46" y="194" font-size="9" fill="#8B4513">(185/ч)</text>
  <text x="125" y="440" font-size="9" fill="#8B4513" transform="rotate(-90 125 440)">Паллеты порожние (185/ч)</text>
  <text x="162" y="552" font-size="9" fill="#8B4513">Паллеты порожние → паллетирование (185/ч)</text>
  <text x="795" y="578" font-size="9" fill="#8B4513" text-anchor="end">Паллеты исходящие (185/ч)</text>

  <!-- ЯЩИКИ — синий -->
  <g stroke="#0050C8" stroke-width="2.2" fill="none">
    <path d="M 270 190 L 288 190" marker-end="url(#mk-box)"/>
    <path d="M 315 225 L 315 255" marker-end="url(#mk-box)"/>
    <path d="M 330 300 L 330 318" marker-end="url(#mk-box)"/>
    <path d="M 640 315 L 664 315" marker-end="url(#mk-box)"/>
    <path d="M 745 375 L 745 392" marker-end="url(#mk-box)"/>
    <path d="M 700 510 L 700 528" marker-end="url(#mk-box)"/>
  </g>
  <text x="188" y="208" font-size="9" fill="#0050C8">Ящики (3 700/ч)</text>
  <text x="319" y="336" font-size="9" fill="#0050C8">Ящики повторные (2 960/ч)</text>
  <text x="334" y="310" font-size="9" fill="#0050C8">Ящики пустые (3 700/ч)</text>
  <text x="668" y="316" font-size="9" fill="#0050C8">Ящики заполненные</text>
  <text x="668" y="328" font-size="9" fill="#0050C8">(3 700/ч)</text>
  <text x="749" y="386" font-size="9" fill="#0050C8">Ящики заклеенные</text>
  <text x="749" y="398" font-size="9" fill="#0050C8">(3 700/ч)</text>
  <text x="698" y="506" font-size="9" fill="#0050C8">Ящики на паллеты (185 паллет/ч)</text>

  <!-- ТОВАРЫ — красный -->
  <g stroke="#C00000" stroke-width="2.2" fill="none">
    <path d="M 360 204 L 380 204" marker-end="url(#mk-item)"/>
    <path d="M 465 225 L 465 296" marker-end="url(#mk-item)"/>
    <path d="M 465 150 L 465 120 L 700 120" marker-end="url(#mk-item)"/>
    <path d="M 570 300 L 570 292" marker-end="url(#mk-item)"/>
  </g>
  <text x="364" y="216" font-size="9" fill="#C00000">Товары (100 000/ч)</text>
  <text x="469" y="268" font-size="9" fill="#C00000">Товары на сортировку (100 000 − nonsort − исключения)</text>
  <text x="469" y="112" font-size="9" fill="#C00000">Товары nonsort (5–15 %)</text>

  <!-- ИСКЛЮЧЕНИЯ / ВОЗВРАТ — оранжевый -->
  <g stroke="#E67E00" stroke-width="2.2" fill="none">
    <path d="M 568 188 L 586 188" marker-end="url(#mk-return)"/>
    <path d="M 588 194 L 570 194" marker-end="url(#mk-return)"/>
    <path d="M 605 300 L 605 285" marker-end="url(#mk-return)"/>
    <path d="M 640 186 L 640 142 L 720 142" marker-end="url(#mk-return)"/>
  </g>
  <text x="574" y="250" font-size="9" fill="#E67E00">Исключения (1–3 %)</text>
  <text x="574" y="208" font-size="8" fill="#E67E00" text-anchor="start">Повторный</text>
  <text x="574" y="222" font-size="8" fill="#E67E00" text-anchor="start">прогон</text>
  <text x="644" y="132" font-size="9" fill="#E67E00">Перевод в nonsort (после отбраковки)</text>

  <!-- РОЛЛТЕЙНЕРЫ — зелёный -->
  <g stroke="#008000" stroke-width="2.2" fill="none">
    <path d="M 848 140 L 855 140 L 855 530 L 920 530" marker-end="url(#mk-roll)"/>
    <path d="M 930 555 L 865 555 L 865 142 L 848 142" marker-end="url(#mk-roll)"/>
  </g>
  <text x="960" y="56" font-size="9" fill="#008000">Роллтейнеры с nonsort → ворота (до 192/ч)</text>
  <text x="960" y="72" font-size="9" fill="#008000">Роллтейнеры порожние → участок nonsort</text>

  <!-- БРАК / ОТХОДЫ — серый -->
  <g stroke="#808080" stroke-width="2.2" fill="none">
    <path d="M 270 262 L 170 262 L 170 530 L 100 530 L 100 540" marker-end="url(#mk-waste)"/>
    <path d="M 40 580 L 26 580" marker-end="url(#mk-waste)"/>
  </g>
  <text x="155" y="570" font-size="9" fill="#808080">Брак ящиков (740/ч)</text>
  <text x="22" y="574" font-size="9" fill="#808080" text-anchor="end">Вывоз брака и отходов</text>

  <!-- ИНФОРМАЦИОННЫЕ ПОТОКИ — фиолетовый пунктир -->
  <text x="155" y="130" font-size="8" fill="#6A0DAD">WMS — информационные потоки</text>
  <text x="155" y="142" font-size="8" fill="#6A0DAD">(привязка на каждом шаге)</text>

  <!-- ==================== ЛЕГЕНДА ==================== -->
  <g font-size="11">
    <text x="1260" y="78" font-weight="bold" fill="#000000">Условные обозначения</text>
    <line x1="1260" y1="96" x2="1300" y2="96" stroke="#333333" stroke-width="2.5"/>
    <text x="1308" y="100" font-size="10">Машины (грузовики)</text>
    <line x1="1260" y1="116" x2="1300" y2="116" stroke="#8B4513" stroke-width="2.5"/>
    <text x="1308" y="120" font-size="10">Паллеты</text>
    <line x1="1260" y1="136" x2="1300" y2="136" stroke="#0050C8" stroke-width="2.5"/>
    <text x="1308" y="140" font-size="10">Ящики</text>
    <line x1="1260" y1="156" x2="1300" y2="156" stroke="#C00000" stroke-width="2.5"/>
    <text x="1308" y="160" font-size="10">Товары</text>
    <line x1="1260" y1="176" x2="1300" y2="176" stroke="#E67E00" stroke-width="2.5"/>
    <text x="1308" y="180" font-size="10">Исключения / возврат</text>
    <line x1="1260" y1="196" x2="1300" y2="196" stroke="#008000" stroke-width="2.5"/>
    <text x="1308" y="200" font-size="10">Роллтейнеры</text>
    <line x1="1260" y1="216" x2="1300" y2="216" stroke="#808080" stroke-width="2.5"/>
    <text x="1308" y="220" font-size="10">Брак / отходы</text>
    <line x1="1260" y1="236" x2="1300" y2="236" stroke="#6A0DAD" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="1308" y="240" font-size="10">Информационные потоки</text>

    <text x="1260" y="268" font-weight="bold" fill="#000000">Зоны</text>
    <rect x="1260" y="278" width="14" height="10" fill="#DCEBF5" stroke="#00008B" stroke-width="1"/>
    <text x="1282" y="287" font-size="10">Приёмка / отгрузка</text>
    <rect x="1260" y="294" width="14" height="10" fill="#EAF4EA" stroke="#00008B" stroke-width="1"/>
    <text x="1282" y="303" font-size="10">Основной контур</text>
