<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сортировочный центр — симуляция</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1><span>Robozone</span> — Сортировочный центр</h1>
      <div id="controls">
        <button class="primary" id="btnStart">Старт</button>
        <button id="btnPause">Пауза</button>
        <button class="danger" id="btnReset">Сброс</button>
        <span class="sep"></span>
        <button id="btnGenEvent">Сгенерировать событие</button>
      </div>
    </header>
    <main>
      <div id="simulation-container">
        <canvas id="simCanvas"></canvas>
      </div>
    </main>
    <div id="status-bar">
      <span class="stat"><span class="dot green"></span><span class="label">Статус:</span><span class="value" id="status-label">Готов</span></span>
      <span class="stat"><span class="label">Время:</span><span class="value" id="status-time">0:00</span></span>
      <span class="stat"><span class="label">Товаров:</span><span class="value">0</span></span>
      <span class="stat"><span class="label">КТЯ:</span><span class="value">0</span></span>
      <span class="stat"><span class="label">Палет:</span><span class="value">0</span></span>
      <span class="stat"><span class="label">NonSort:</span><span class="value">0%</span></span>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="classes/SimulationEngine.js"></script>
  <script src="visualization.js"></script>
  <script src="app.js"></script>
</body>
</html>
